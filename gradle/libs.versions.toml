[versions]
clikt = "5.1.0"
kotlin = "2.3.20"
dotenv = "6.5.1"
ktfmt = "0.26.0"
kotlin-logging = "7.0.3"
logback = "1.5.6"
logstash-logback-encoder = "8.0"

[libraries]
clikt = { module = "com.github.ajalt.clikt:clikt-jvm", version.ref = "clikt" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
dotenv = { module = "io.github.cdimascio:dotenv-kotlin", version.ref = "dotenv" }
ktfmt-gradle-plugin = { module = "com.ncorti.ktfmt.gradle:com.ncorti.ktfmt.gradle.gradle.plugin", version.ref = "ktfmt" }
ktlogging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }
